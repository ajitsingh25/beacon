name: Scheduled Helpline Validation

on:
  schedule:
    - cron: "0 6 * * *"  # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run validator
        id: validate
        run: |
          node scripts/validate.js --warn-as-error
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Upload status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-status
          path: data/status.json

      - name: Create issue on validation failure
        if: steps.validate.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['validation'],
              per_page: 5
            });
            const existing = issues.find(i => i.title.includes('Helpline validation failed'));
            const body = `Scheduled validation failed on \`${new Date().toISOString().split('T')[0]}\`.
            
            Check the workflow run for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
            
            Common causes:
            - An entry's \`lastChecked\` date is older than 90 days (stale)
            - A source URL returned an error
            - Schema mismatch in \`data/helplines.json\`
            
            Run \`node scripts/validate.js\` locally to see full output.`;
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: body + '\n\n---\n*Auto-updated by scheduled validation.*',
                state: 'open'
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Helpline validation failed — stale or invalid entries',
                body: body,
                labels: ['validation', 'automated']
              });
            }